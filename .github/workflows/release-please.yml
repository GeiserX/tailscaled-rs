# Release automation: commit-type-driven version bumps via release-please.
#
# This is the *versioning* half of the release pipeline; `release.yml` is the
# *binary-building* half. They are intentionally separate and chain through a tag:
#
#   1. Commits land on `main` using Conventional Commits (feat:, fix:, …).
#   2. release-please reads every commit since the last release and maintains a
#      standing "release PR" that bumps `version` in Cargo.toml and rewrites the
#      `[Unreleased]` section of CHANGELOG.md into a dated, versioned entry.
#   3. When a human merges that release PR, release-please creates the GitHub
#      Release and pushes the tag `v{version}` (e.g. `v0.2.0`).
#   4. That `v*` tag push is exactly the trigger `release.yml` listens for, so the
#      cross-compiled `tailnetd`/`tnet` binaries are built and attached to the
#      Release that release-please just opened.  release-please never builds
#      binaries; release.yml never decides versions — no overlap.
#
# Pre-1.0 semantics (the project is 0.x): with `release-type: rust`, release-please's
# default pre-major behavior matches CHANGELOG.md's stated policy —
#   feat:     → minor (0.MINOR.0)
#   fix:      → patch (0.x.PATCH)
#   breaking  → minor while < 1.0 (NOT a major bump), surfaced under "Changed"
# so no extra config is needed to honor "breaking changes may land in a minor".
#
# Tag format: release.yml triggers on the `v*` glob, so the tag MUST be `v{version}`
# (e.g. `v0.2.0`) with no component prefix. Two config keys together produce that:
#   include-v-in-tag: true          → prepend the `v`
#   include-component-in-tag: false → DROP the `tailscaled-rs-` package prefix
# Both live in release-please-config.json. The second is load-bearing and easy to
# miss: in manifest mode `include-component-in-tag` DEFAULTS TO TRUE, which emits
# `tailscaled-rs-v{version}` — that does NOT match `v*`, so release.yml never fires
# and the GitHub Release ships with no binaries. Do not change the glob or either
# key without the others, or the tag → binaries chain silently breaks.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# release-please needs to open/maintain the release PR and, on merge, create the
# release + tag. `actions: write` lets the post-release step dispatch release.yml
# (the GITHUB_TOKEN recursion guard means the tag push alone won't trigger it).
permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time, never cancelled: two quick pushes to main must not interleave a
# release-please force-push with the close and reopen in the last step. A queued run
# that a newer one replaces loses nothing, because release-please reads the current state.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain release PR · cut release on merge
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest-driven config (the v4 action's preferred mode): the source of
          # truth is release-please-config.json + .release-please-manifest.json at
          # the repo root, which set release-type=rust and the current version.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Kick off the binary build (release.yml) when a release was just cut.
      #
      # Why we can't rely on release.yml's own `on: push: tags: ['v*']`: the tag is
      # pushed by release-please using the workflow's GITHUB_TOKEN, and GitHub
      # deliberately does NOT trigger further workflow runs from events made with
      # GITHUB_TOKEN (recursion guard). So a release-please tag push lands silently
      # and release.yml never fires — the Release ships with no binaries. Explicitly
      # dispatching it here closes that gap without needing a PAT. (release.yml keeps
      # its tag/dispatch triggers for manual re-runs.)
      - name: Dispatch binary build for the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"

      # Keep the release PR mergeable: up to date with main, with its required checks run.
      #
      # release-please pushes the release branch with the built-in token, and GitHub starts
      # no real workflow run from an event made with that token (it records a `pull_request`
      # run that fails at once with no jobs), so the release PR's required checks never
      # report. A `workflow_dispatch` does not help: its check runs land on the head commit,
      # but GitHub leaves them out of the pull request, so the branch rules stay blocked.
      # The checks must come from a `pull_request` event made by a real identity, so this
      # step acts with the RELEASE_PR_TOKEN secret: a fine-grained PAT for this repository
      # with Contents, Pull requests and Workflows write (Workflows, because updating the
      # branch can bring workflow changes from main into it).
      #
      # release-please only pushes the branch when the release notes change, so a commit
      # that adds no notes (chore:, ci:, a Dependabot bump) leaves the PR behind main, and
      # main requires branches to be up to date. A branch that is behind is updated with
      # the PAT, which starts CI on the new head. Otherwise, a head without its required
      # checks from a `pull_request` run gets the PR closed and reopened with the PAT,
      # which starts CI the same way.
      #
      # The decision comes from the branch and its head commit, so a rerun repairs an
      # interrupted run and an unchanged PR is left alone. The PR is found with a plain
      # list, not `--label` (that goes through search, which lags a PR opened a second
      # ago), and the head is read from the branch ref, not from the PR record, which can
      # lag a force-push.
      # release-please itself keeps the built-in token, so the tag push starts nothing and
      # the dispatch above stays the only binary build.
      # This step runs last so that its failure can never skip that dispatch.
      - name: Keep the release PR up to date and checked
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so the release PR cannot get its required checks."
            exit 1
          fi
          repo=$GITHUB_REPOSITORY
          pr=$(gh pr list --repo "$repo" --state open --limit 200 --json number,headRefName,baseRefName,labels \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))][0] // empty')
          if [ -z "$pr" ]; then echo "No open release PR."; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          head=$(gh api "repos/$repo/git/ref/heads/$branch" --jq .object.sha)

          behind=$(gh api "repos/$repo/compare/$base...$head" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "Release PR #$number is $behind commit(s) behind $base; updating its branch."
            if ! gh api -X PUT "repos/$repo/pulls/$number/update-branch" \
                -f expected_head_sha="$head" >/dev/null; then
              echo "::error::Could not update the branch of release PR #$number (a merge conflict?). Update it by hand."
              exit 1
            fi
            exit 0
          fi

          # Required checks that came from a pull_request run on this head. Dispatched runs
          # do not count for the PR, and the bot's instant-fail run has no check runs.
          suites=$(gh api --paginate "repos/$repo/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[].check_suite_id]' | jq -s 'add // []')
          checks=$(gh api --paginate "repos/$repo/commits/$head/check-runs?per_page=100" \
            --jq '.check_runs[] | {suite: .check_suite.id, name}' \
            | jq -r --argjson suites "$suites" 'select(.suite as $s | $suites | index($s)) | .name')
          required_checks=('fmt · clippy · test · build')
          for required in "${required_checks[@]}"; do
            if ! grep -qxF "$required" <<<"$checks"; then
              echo "'$required' has no pull_request run on $head; closing and reopening release PR #$number."
              # Reopen only once the PR record shows this head, so CI runs on it.
              for _ in $(seq 1 15); do
                [ "$(gh pr view "$number" --repo "$repo" --json headRefOid --jq .headRefOid)" = "$head" ] && break
                sleep 4
              done
              gh pr close "$number" --repo "$repo"
              gh pr reopen "$number" --repo "$repo" || { sleep 10; gh pr reopen "$number" --repo "$repo"; }
              exit 0
            fi
          done
          echo "Release PR #$number is up to date and its required checks ran on $head."
