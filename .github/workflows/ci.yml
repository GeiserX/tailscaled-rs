name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets this workflow be run against a ref on demand, which is the only way some pull requests can ever get
  # the check that gates them.
  #
  # GitHub does not trigger workflows from events created with a workflow's own GITHUB_TOKEN — the recursion
  # guard. release-please opens its release pull request with that token, so `pull_request` never fires for it
  # and `fmt · clippy · test · build` never reports. That check is required by branch protection on `main`, so
  # those pull requests are unmergeable forever: not failing, just never checked. Two of them sat for days.
  #
  # This file already documents the same guard for the TAG push, in release-please.yml, and works around it by
  # dispatching the release build explicitly. One guard, two affected events; this is the second one.
  #
  # A dispatched run's check runs attach to the head commit of the ref it ran against, and branch protection
  # matches a required check by CONTEXT NAME, not by which event produced it — so a run dispatched against a
  # release branch satisfies the same requirement a pull_request run would have.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The engine requires this acknowledgement even to link against it in some paths.
  TS_RS_EXPERIMENT: this_is_unstable_software

jobs:
  test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The `tun` feature is off by default (it pulls the privileged kernel-TUN
      # transport). Lint + build it explicitly so the cfg(feature = "tun")-gated
      # code can't silently rot — it isn't covered by the default-config steps above.
      - name: Clippy (tun feature)
        run: cargo clippy --all-targets --features tun -- -D warnings

      # The `ssh` feature is off by default (it pulls the russh-based Tailscale SSH
      # server — a remote-shell surface). Lint + test + build it explicitly: this is
      # security-sensitive code, so the primary gate must cover it, not just the
      # `coverage` job's `--all-features` run.
      - name: Clippy (ssh feature)
        run: cargo clippy --all-targets --features ssh -- -D warnings

      # The `acme` feature is off by default (it pulls the engine's ACME cert-issuance path for
      # `tnet cert`). Lint it explicitly so the cfg(feature = "acme")-gated code can't silently rot —
      # the default-config steps only compile the non-acme fail-closed branch.
      - name: Clippy (acme feature)
        run: cargo clippy --all-targets --features acme -- -D warnings

      # The `identity-federation` feature is off by default (it pulls the engine's OAuth/OIDC
      # auth-key exchange for `tnet up --client-id/--client-secret/--id-token/--audience`). Lint + test
      # it explicitly so the cfg(feature = "identity-federation")-gated WIF code can't silently rot —
      # the default-config steps only compile the non-feature branch (where the daemon refuses the
      # flags). Security-sensitive (credential handling), so the gating job must cover it directly.
      - name: Clippy (identity-federation feature)
        run: cargo clippy --all-targets --features identity-federation -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Test (ssh feature)
        run: cargo test --all-targets --features ssh

      - name: Test (identity-federation feature)
        run: cargo test --all-targets --features identity-federation

      # Reclaim disk before the release builds. The debug-profile test artifacts above accumulate a
      # separate compiled set per feature config (default / ssh / identity-federation), each pulling a
      # full engine rebuild — on the GitHub-hosted `ubuntu-latest` runner (~14 GB free) this peak has
      # intermittently hit `No space left on device` during the last feature test (a transient that
      # clears on re-run, but costs a re-run). The release builds below use a distinct `target/release`
      # profile and need none of the `target/debug` artifacts, so dropping the dev profile here bounds
      # peak usage with no loss of coverage. `rust-cache` (above) saves its cache from an earlier point
      # in the job, so this does not defeat cross-run caching.
      - name: Reclaim disk (drop debug artifacts before release builds)
        run: cargo clean --profile dev

      - name: Build release
        run: cargo build --release --bins

      - name: Build release (tun feature)
        run: cargo build --release --bins --features tun

      - name: Build release (ssh feature)
        run: cargo build --release --bins --features ssh

  # The smoke test for every change, engine bumps included: the real join, netmap and down flow of
  # tests/headscale_e2e.rs against a self-hosted Headscale, the loop in
  # test-support/headscale/README.md. The pre-auth key is minted inside this job from a throwaway
  # control server and never read from a secret, so the job runs on every pull request, forks
  # included. Headscale-green is not Tailscale-green; see docs/development.md.
  headscale-e2e:
    name: headscale e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit `bash` gives `-eo pipefail`, so the `tee` below cannot hide a failing test.
        shell: bash
    env:
      HS_COMPOSE: test-support/headscale/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the e2e test
        run: cargo test --test headscale_e2e --no-run

      # The image is pinned in the compose file (headscale/headscale:0.28.0, never `:latest`).
      # `--wait` returns once the healthcheck (`headscale nodes list`) passes.
      - name: Start Headscale and wait for its healthcheck
        run: docker compose -f "$HS_COMPOSE" up -d --wait --wait-timeout 120

      - name: Mint a user and a reusable pre-auth key
        run: |
          hs() { docker compose -f "$HS_COMPOSE" exec -T headscale headscale "$@"; }
          hs users create test
          # 0.28.0's `preauthkeys --user` takes the numeric user id, not the name.
          HS_UID=$(hs users list -o json | python3 -c "import sys,json; print(next(u['id'] for u in json.load(sys.stdin) if u['name']=='test'))")
          KEY=$(hs preauthkeys create --user "$HS_UID" --reusable --expiration 24h)
          case "$KEY" in
            hskey-auth-*) ;;
            *) echo "headscale minted no pre-auth key"; exit 1 ;;
          esac
          echo "::add-mask::$KEY"
          echo "TAILNETD_HS_AUTHKEY=$KEY" >> "$GITHUB_ENV"

      - name: Run the e2e
        env:
          TAILNETD_HS_URL: http://localhost:8080
        run: |
          cargo test --test headscale_e2e -- --ignored --nocapture 2>&1 | tee e2e.log
          # The test skips, and passes, when its two variables are unset. A skip here means the job
          # lost its key, so it fails rather than report a smoke test that never ran.
          if grep -q '^SKIP' e2e.log; then
            echo "the headscale e2e skipped instead of running"
            exit 1
          fi

      - name: Headscale logs
        if: failure()
        run: docker compose -f "$HS_COMPOSE" logs headscale

      - name: Tear Headscale down
        if: always()
        run: docker compose -f "$HS_COMPOSE" down -v

  coverage:
    name: coverage (codecov)
    runs-on: ubuntu-latest
    # Separate job: does NOT gate the `test` job above. The Codecov check is
    # informational (see codecov.yml) — 90% is the TARGET, not yet met, so a
    # below-threshold result here must not turn CI red while coverage is built up.
    # TS_RS_EXPERIMENT is inherited from the workflow-level `env:` block above.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Runs `cargo test` under instrumentation. `#[ignore]`d tests (headscale_e2e,
      # which needs a control server) are skipped: we do NOT pass `--ignored`, so they
      # never run under coverage. The `headscale e2e` job above runs them.
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Public repo: upload works tokenless. Token is optional and only used
          # if the secret is set; absence does not fail the upload for public repos.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov flake must not gate the build.
          fail_ci_if_error: false
